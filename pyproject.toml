[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipedream-research"
version = "0.1.0"
description = "Research code for studying PipeDream, GPD, and SGD on block-structured objectives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[tool.setuptools]
packages = [
  "src",
  "src.objectives",
  "src.schedulers",
  "src.methods",
  "src.state",
  "src.experiments",
  "src.plotting",
  "src.utils",
]
